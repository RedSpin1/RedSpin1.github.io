<!DOCTYPE html>
<html>
<head>
<title>Reset Password - TruthAI</title>
<link rel="stylesheet" href="style.css">
<link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
</head>
<body>

<a href="https://truthai.online/">
<img src="favicon.png" id="logo">
</a>

<div id="app">
<h1>Reset Password</h1>

<p id="resetEmailText" class="auth-small-text">Checking reset link...</p>

<input type="password" id="newPasswordInput" class="auth-input" placeholder="New password">
<input type="password" id="confirmPasswordInput" class="auth-input" placeholder="Confirm password">

<button id="resetPasswordBtn">Reset Password</button>

<div id="resetMessage"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");
const oobCode = params.get("oobCode");

if (mode !== "resetPassword" || !oobCode) {
window.location.href = "/404.html";
}

const firebaseConfig = {
apiKey: "AIzaSyBTfH0NhDeTmxjhwjxYgr7YzK4V4zQrcI4",
authDomain: "truthai-project1.firebaseapp.com",
projectId: "truthai-project1",
storageBucket: "truthai-project1.firebasestorage.app",
messagingSenderId: "627323022305",
appId: "1:627323022305:web:3a49f49bc659397f8040a0"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const resetEmailText = document.getElementById("resetEmailText");
const newPasswordInput = document.getElementById("newPasswordInput");
const confirmPasswordInput = document.getElementById("confirmPasswordInput");
const resetPasswordBtn = document.getElementById("resetPasswordBtn");
const resetMessage = document.getElementById("resetMessage");

auth.verifyPasswordResetCode(oobCode)
.then(email => {
resetEmailText.innerText = `Reset password for ${email}`;
})
.catch(() => {
window.location.href = "/404.html";
});

resetPasswordBtn.addEventListener("click", async () => {
const password = newPasswordInput.value;
const confirmPassword = confirmPasswordInput.value;

resetMessage.style.color = "#f87171";
resetMessage.innerText = "";

if (!password || !confirmPassword) {
resetMessage.innerText = "Enter and confirm your new password.";
return;
}

if (password !== confirmPassword) {
resetMessage.innerText = "Passwords do not match.";
return;
}

if (password.length < 6) {
resetMessage.innerText = "Password should be at least 6 characters.";
return;
}

try {
resetPasswordBtn.disabled = true;
resetPasswordBtn.innerText = "Resetting...";

await auth.confirmPasswordReset(oobCode, password);

resetMessage.style.color = "#34d399";
resetMessage.innerText = "Password reset successfully. Redirecting...";

setTimeout(() => {
window.location.href = "https://truthai.online/";
}, 1800);
} catch {
resetMessage.style.color = "#f87171";
resetMessage.innerText = "Could not reset password. Try requesting a new reset link.";

resetPasswordBtn.disabled = false;
resetPasswordBtn.innerText = "Reset Password";
}
});
</script>

</body>
</html>

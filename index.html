<!DOCTYPE html>
<html>
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6504999697428783"
     crossorigin="anonymous"></script>
    
    <link rel="stylesheet" href="style.css">
    
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>

    <!-- 🔥 Logo (top left) -->
    <a href="https://truthai.online/">
    <img src="favicon.png" id="logo">
</a>

    <div id="app">
        <h1>AI/Human Content Detector</h1>
        
        <div id="input-area">
            <div class="input-wrapper">
                <textarea id="textInput" placeholder="Paste your text here..."></textarea>
                <div id="wordCount" class="count-red">Min. 50 words: 0</div>
            </div>
            <button id="analyzeBtn">See Results</button>
        </div>

        <div id="result-area" class="hidden">
            <div id="verdict"></div>
            <button id="resetBtn">Analyze Another</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>

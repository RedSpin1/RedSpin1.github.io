<!DOCTYPE html>
<html>
<head>
    <title>Truth AI</title>

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
</head>
<body>

    <a href="https://truthai.online/">
        <img src="favicon.png" id="logo">
    </a>

    <div id="app">
        <h1>AI/Human Content Detector</h1>
        
        <div id="input-area">
            <div class="input-wrapper">
                <textarea id="textInput" placeholder="Paste your text here..."></textarea>

                <input 
                    type="file" 
                    id="fileUpload" 
                    accept=".txt,.pdf,.docx" 
                    hidden
                >

                <button type="button" id="uploadFileBtn">➜] Upload</button>

                <div id="wordCount" class="count-red">Min. 50 words: 0</div>
            </div>

            <button id="analyzeBtn">See Results</button>
        </div>

        <div id="result-area" class="hidden">
            <div id="verdict"></div>
            <button id="resetBtn">Analyze Another</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Truth AI</title>
    <meta name="description" content="Detect whether text is AI-generated or human-written with TruthAI. Fast, accurate, and easy to use.">

    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
</head>
<body>

    <button type="button" id="authButton">Login</button>

    <div id="authModal" class="auth-modal hidden">
        <div class="auth-card">
            <button type="button" id="closeAuthModal" class="auth-close">×</button>

            <h2 id="authTitle">Welcome to TruthAI</h2>
            <p id="authSubtitle">Login for unlimited beta scans.</p>

            <button type="button" id="googleLoginBtn" class="auth-main-btn">Continue with Google</button>

            <div class="auth-divider">or</div>

            <input type="email" id="authEmail" class="auth-input" placeholder="Email">
            <input type="password" id="authPassword" class="auth-input" placeholder="Password">

            <button type="button" id="emailLoginBtn" class="auth-main-btn">Login</button>
            <button type="button" id="emailSignupBtn" class="auth-secondary-btn">Create Account</button>

            <button type="button" id="logoutBtn" class="auth-secondary-btn hidden">Logout</button>

            <div id="authMessage"></div>
        </div>
    </div>

    <a href="https://truthai.online/">
        <img src="favicon.png" id="logo">
    </a>

    <div id="app">
        <h1>AI/Human Content Detector</h1>
        
        <div id="input-area">
            <div class="input-wrapper">
                <textarea id="textInput" placeholder="Paste your text here..."></textarea>

                <input 
                    type="file" 
                    id="fileUpload" 
                    accept=".txt,.pdf,.docx" 
                    hidden
                >

                <button type="button" id="uploadFileBtn">➜] Upload</button>

                <div id="wordCount" class="count-red">Min. 50 Words: <span id="wordCountNumber">0</span></div>
            </div>

            <button id="analyzeBtn">See Results</button>
        </div>

        <div id="result-area" class="hidden">
            <div id="verdict"></div>
            <button id="resetBtn">Analyze Another</button>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
